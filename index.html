<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ekaantik Software Solutions</title>
  <link rel="icon" href="favicon.ico">
  <link href="style.css" rel="stylesheet">
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body x-data="{ page: 'home', 'darkMode': true, 'stickyMenu': false, 'navigationOpen': false, 'scrollTop': false }"
  x-init="
          darkMode = JSON.parse(localStorage.getItem('darkMode'));
          $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
  :class="{'dark bg-black': darkMode === true}">

  <!-- ====== Section Containers====== -->
  <section id="header" data-include="header.html"></section>
  <section id="hero" data-include="hero.html"></section>
  <section id="features" data-include="small-features.html"></section>
  <section id="about" data-include="about.html"></section>
  <section id="services" data-include="services.html"></section>
  <section id="pricing-table" data-include="pricing-table.html"></section>
  <section id="portfolio" data-include="portfolio.html"></section>
  <section id="testimonials" data-include="testimonials.html"></section>
  <section id="counter" data-include="counter.html"></section>
  <section id="clients" data-include="clients.html"></section>
  <section id="team" data-include="team.html"></section>
  <section id="contact" data-include="contact.html"></section>
  <section id="footer" data-include="footer.html"></section>

  <!-- ====== Back To Top Button====== -->
  <button
    class="hidden items-center justify-center w-10 h-10 rounded-[4px] shadow-solid-5 bg-primary hover:bg-primaryho fixed bottom-8 right-8 z-999"
    @click="window.scrollTo({top: 0, behavior: 'smooth'})"
    @scroll.window="scrollTop = (window.pageYOffset > 50) ? true : false" :class="{ '!flex' : scrollTop }">
    <svg class="fill-white w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <path
        d="M233.4 105.4c12.5-12.5 32.8-12.5 45.3 0l192 192c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L256 173.3 86.6 342.6c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3l192-192z" />
    </svg>
  </button>

  <!-- ====== Section Loader Script ====== -->
  <script>
    document.querySelectorAll('[data-include]').forEach(async (el) => {
      const file = el.getAttribute('data-include');
      const res = await fetch(file);
      el.innerHTML = await res.text();
    });
  </script>

  <script defer src="bundle.js"></script>
</body>
</html>
