<!-- ===== Clients Start ===== -->
<section class="pt-20 lg:pt-25 xl:pt-30">
  <!-- Section Title Start -->
  <div x-data="{ sectionTitle: `Clients`}">
    <div class="animate_top fade-section mx-auto max-w-1390 text-center px-4 md:px-8 xl:px-0">
      <h2 x-text="sectionTitle"
        class="font-semibold text-3xl xl:text-title-xl text-black dark:text-white md:w-4/5 xl:w-1/2 mx-auto mb-4.5">
      </h2>
      <p class="mx-auto md:w-4/5 lg:w-3/5 xl:w-[46%]" x-text="sectionTitleText"></p>
    </div>


  </div>
  <!-- Section Title End -->

  <div
    class="mx-auto max-w-1390 border-b border-strokedark dark:border-stroke pb-20 lg:pb-22.5 px-4 md:px-8 2xl:px-49 mt-15">
    <div class="grid grid-cols-3 md:grid-cols-6 gap-7.5 lg:gap-12.5 xl:gap-17.5 justify-center items-center">
      <a href="#" class="block animate_top fade-section">
        <img class="opacity-65 ease-in-out duration-300 hover:opacity-100 dark:hidden" src="images/InfraRed-Power.png"
          alt="Clients" />
        <img class="hidden opacity-50 ease-in-out duration-300 hover:opacity-100 dark:block"
          src="images/InfraRed-Power-dark.png" alt="Clients" />
      </a>
      <a href="#" class="block animate_top fade-section">
        <img class="opacity-65 ease-in-out duration-300 hover:opacity-100 dark:hidden" src="images/Detmo.png"
          alt="Clients" />
        <img class="hidden opacity-50 ease-in-out duration-300 hover:opacity-100 dark:block" src="images/Detmo-dark.png"
          alt="Clients" />
      </a>
      <a href="#" class="block animate_top fade-section">
        <img class="opacity-65 ease-in-out duration-300 hover:opacity-100 dark:hidden" src="images/esecurify.png"
          alt="Clients" />
        <img class="hidden opacity-50 ease-in-out duration-300 hover:opacity-100 dark:block"
          src="images/esecurify-dark.png" alt="Clients" />
      </a>

    </div>
  </div>
</section>
